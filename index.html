<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0410 — Since the First Kiss</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#faf9f6; color:#242321; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",
    "PingFang TC","Microsoft JhengHei",sans-serif;
  }
  main{text-align:center;padding:32px}
  .mark{font-size:clamp(64px,18vw,150px);font-weight:300;letter-spacing:.08em;line-height:1}
  .sub{margin-top:18px;font-size:12px;letter-spacing:.34em;color:#8b877f}
  .date{margin-top:46px;font-size:13px;letter-spacing:.18em;color:#77736c}
  .timer{margin-top:15px;font-variant-numeric:tabular-nums;letter-spacing:.08em;
         font-size:clamp(25px,6vw,46px);font-weight:300}
  .hint{margin-top:42px;font-size:13px;color:#aaa59c;letter-spacing:.08em}
</style>
</head>
<body>
<main>
  <div class="mark">0410</div>
  <div class="sub">SINCE THE FIRST KISS</div>
  <div class="date">2026 · 08 · 06　04:10</div>
  <div class="timer" id="timer">00 DAYS · 00:00:00</div>
  <div class="hint">時間，從那一刻開始。</div>
</main>
<script>
const start = new Date("2026-08-06T04:10:00+08:00");
function pad(n){return String(n).padStart(2,"0")}
function tick(){
  let s=Math.max(0,Math.floor((Date.now()-start.getTime())/1000));
  const d=Math.floor(s/86400); s%=86400;
  const h=Math.floor(s/3600); s%=3600;
  const m=Math.floor(s/60); const sec=s%60;
  document.getElementById("timer").textContent =
    `${String(d).padStart(2,"0")} DAYS · ${pad(h)}:${pad(m)}:${pad(sec)}`;
}
tick(); setInterval(tick,1000);
</script>
</body>
</html>
